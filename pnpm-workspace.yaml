packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  esbuild: true
  unrs-resolver: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
  - lucide-react@1.32.0
  - openai@7.5.0
  - vitest@4.1.11
  - '@clerk/backend@3.16.8'
  - '@clerk/nextjs@7.7.8'
  - fastify@5.12.1
  - '@clerk/expo@4.5.0'
  - tailwind-merge@3.7.0
peerDependencyRules:
  allowedVersions:
    utf-8-validate: '>=5.0.2 <7'
